<script type="text/plain" id="app-src">var D = window.__DASHBOARD_DATA__;
var MEMBERS = D.members || [];
var PERIOD = String(D.period || '').split('-').join('/');
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad2(n){return n.toString().padStart(2,'0');}
/* 原版第一次載入的計時器（React useEffect）在第一次繪製後才開始；之後由點擊、輸入觸發的則當下開始 */
var firstRender=true;
function afterPaint(fn){
  if(!firstRender)return fn();
  var done=false;function run(){if(!done){done=true;fn();}}
  function viaTask(){var ch=new MessageChannel();ch.port1.onmessage=run;ch.port2.postMessage(null);}
  function hid(){if(document.hidden){document.removeEventListener('visibilitychange',hid);viaTask();}}
  requestAnimationFrame(function(){document.removeEventListener('visibilitychange',hid);setTimeout(run,0);});
  if(document.hidden)viaTask();else document.addEventListener('visibilitychange',hid);
}

/* 燈號門檻與配色（同原版） */
function cardColor(v){
  return v>=70?{bg:'bg-green-500',text:'text-green-500'}:v>=50?{bg:'bg-yellow-500',text:'text-yellow-500'}:
    v>=26?{bg:'bg-red-500',text:'text-red-500'}:{bg:'bg-gray-600',text:'text-gray-400'};
}
function modalColor(v){
  return v>=70?{bg:'bg-green-500',text:'text-green-500',border:'border-green-500/30',hex:'#22c55e',shadowColor:'rgba(34,197,94,0.4)'}:
    v>=50?{bg:'bg-yellow-500',text:'text-yellow-500',border:'border-yellow-500/30',hex:'#eab308',shadowColor:'rgba(234,179,8,0.4)'}:
    v>=26?{bg:'bg-red-500',text:'text-red-500',border:'border-red-500/30',hex:'#ef4444',shadowColor:'rgba(239,68,68,0.4)'}:
    {bg:'bg-zinc-600',text:'text-zinc-500',border:'border-zinc-500/30',hex:'#71717a',shadowColor:'rgba(113,113,122,0.4)'};
}
function adviceOf(v){
  if(v===100)return {content:'您的表現無可挑剔，是分會中「付出者收穫」精神的最佳實踐者。',action:'請持續保持當前的節奏，帶領更多夥伴進入綠燈圈。'};
  if(v>=80)return {content:'您是分會中非常穩定的高價值會員，數據表現強勁。',action:'建議強化成交金額的轉化深度。'};
  if(v>=70)return {content:'恭喜達成綠燈目標！這代表您已經建立了良好的商務習慣。',action:'請注意六個月滾動尚缺，確保優勢持續。'};
  if(v>=50)return {content:'目前處於黃燈區間，是一個關鍵的調整期。',action:'請專注於「1對1交流」與「給出引薦」。'};
  if(v>=26)return {content:'當前的數據處於低谷，需要重新找回商務連結。',action:'請立即安排與導師進行深度1對1。'};
  return {content:'數據表現異常。這代表參與度已降至警戒線以下。',action:'請務必聯繫領導團隊讓我們了解您的困難。'};
}
function badgeColor(b){
  return b==='121TOP'?'text-blue-400':b==='來賓TOP'?'text-purple-400':b==='引薦單數 TOP'?'text-orange-400':b==='金額TOP🌟'?'text-yellow-400':'text-zinc-500';
}

/* 音效（開啟／關閉明細） */
function playSound(kind){
  try{
    var ctx=new (window.AudioContext||window.webkitAudioContext)(),gain=ctx.createGain();
    gain.connect(ctx.destination);
    gain.gain.setValueAtTime(0,ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.15,ctx.currentTime+0.005);
    gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+(kind==='open'?0.15:0.2));
    var osc=ctx.createOscillator();osc.type='sine';
    if(kind==='open'){osc.frequency.setValueAtTime(800,ctx.currentTime);osc.frequency.exponentialRampToValueAtTime(1500,ctx.currentTime+0.08);}
    else{osc.frequency.setValueAtTime(1000,ctx.currentTime);osc.frequency.exponentialRampToValueAtTime(400,ctx.currentTime+0.12);}
    osc.connect(gain);
    var click=ctx.createOscillator();click.type='square';click.frequency.setValueAtTime(kind==='open'?2400:1800,ctx.currentTime);
    var cg=ctx.createGain();cg.gain.setValueAtTime(0.05,ctx.currentTime);cg.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.02);
    click.connect(cg);cg.connect(gain);
    osc.start();click.start();osc.stop(ctx.currentTime+0.2);click.stop(ctx.currentTime+0.02);
  }catch(e){console.warn('Audio Context interaction blocked or unsupported.');}
}

/* 統計與 TOP 徽章（同原版：引薦單數 TOP 只看內部引薦） */
var STATS={green:0,yellow:0,red:0,black:0},TOP={oto:0,guest:0,ref:0,money:0};
MEMBERS.forEach(function(m){
  var s=m.scores,v=s.trafficLightScore;
  if(v>=70)STATS.green++;else if(v>=50)STATS.yellow++;else if(v>=26)STATS.red++;else STATS.black++;
  if(s.oneToOne>TOP.oto)TOP.oto=s.oneToOne;
  if(s.guestsBrought>TOP.guest)TOP.guest=s.guestsBrought;
  if(s.internalReferralsGiven>TOP.ref)TOP.ref=s.internalReferralsGiven;
  if(s.businessValue>TOP.money)TOP.money=s.businessValue;
});
function badgesOf(m){
  var s=m.scores,b=[];
  if(TOP.oto>0&&s.oneToOne===TOP.oto)b.push('121TOP');
  if(TOP.guest>0&&s.guestsBrought===TOP.guest)b.push('來賓TOP');
  if(TOP.ref>0&&s.internalReferralsGiven===TOP.ref)b.push('引薦單數 TOP');
  if(TOP.money>0&&s.businessValue===TOP.money)b.push('金額TOP🌟');
  return b;
}

/* ── 燈號分佈統計（12 格 LED，載入 0.2 秒後逐格亮起） ── */
var BARS=[
  {label:'綠燈',key:'green',color:'bg-green-500',glow:'shadow-[0_0_40px_rgba(34,197,94,0.7)]',textColor:'text-green-400'},
  {label:'黃燈',key:'yellow',color:'bg-yellow-500',glow:'shadow-[0_0_35px_rgba(234,179,8,0.6)]',textColor:'text-yellow-400'},
  {label:'紅燈',key:'red',color:'bg-red-500',glow:'shadow-[0_0_35px_rgba(239,68,68,0.6)]',textColor:'text-red-400'},
  {label:'灰燈',key:'black',color:'bg-zinc-600',glow:'shadow-[0_0_30px_rgba(113,113,122,0.4)]',textColor:'text-zinc-500'}
];
var SEGMENTS=12,TICKS=[100,75,50,25,0];
function flagHtml(){
  var cells='';
  for(var g=0;g<12;g++){
    var on=(Math.floor(g/4)+g%4)%2===0;
    cells+='<div class="w-[7px] h-[7px] md:w-3 md:h-3 '+(on?'bg-zinc-100 shadow-[0_0_5px_rgba(255,255,255,0.2)]':'bg-transparent border border-zinc-800')+'"></div>';
  }
  return '<div class="grid grid-cols-4 grid-rows-3 gap-[1.5px] md:gap-[2px] opacity-40 group-hover:opacity-70 transition-opacity duration-700 flex-shrink-0">'+cells+'</div>';
}
function segClass(bar,b,lit,on){
  return 'h-2 md:h-4 w-full rounded-sm transition-all duration-700 '+(on&&b<lit?bar.color+' '+bar.glow+' opacity-100 scale-100':'bg-zinc-800/40 opacity-10 scale-95');
}
function statsHtml(){
  var total=STATS.green+STATS.yellow+STATS.red+STATS.black;
  if(total===0)return '';
  var axis=TICKS.map(function(t){
    return '<div class="flex items-center justify-end gap-2 md:gap-6 group/tick"><span class="text-[9px] md:text-[14px] font-digital font-bold text-zinc-600 group-hover/tick:text-zinc-200 transition-colors">'+t+'<!---->%</span><div class="w-2 md:w-6 h-[1.5px] bg-zinc-800"></div></div>';
  }).join('');
  var grid=TICKS.map(function(){return '<div class="h-[1px] w-full bg-zinc-800/80"></div>';}).join('');
  var bars=BARS.map(function(bar){
    var count=STATS[bar.key],lit=Math.round(count/total*100/100*SEGMENTS),segs='';
    for(var b=0;b<SEGMENTS;b++)segs+='<div class="'+segClass(bar,b,lit,false)+'" data-bar="'+bar.key+'" data-b="'+b+'" style="transition-delay:'+(b*40)+'ms"></div>';
    return '<div class="flex flex-col items-center justify-end h-full w-full max-w-[60px] md:max-w-[160px] group/bar relative">'+
      '<div class="absolute bottom-0 w-24 md:w-64 h-24 md:h-64 rounded-full blur-[40px] md:blur-[80px] transition-opacity duration-1000 opacity-0 '+bar.color+'" data-glow="1"></div>'+
      '<div class="w-8 md:w-20 flex flex-col-reverse gap-1 md:gap-2.5 mb-2 md:mb-3 relative z-10">'+segs+'</div>'+
      '<div class="flex flex-col items-center gap-1">'+
        '<span class="text-2xl md:text-7xl font-black italic tracking-tighter leading-none text-white drop-shadow-[0_0_20px_rgba(0,0,0,0.9)] transition-transform group-hover/bar:scale-110 duration-300">'+count+'</span>'+
        '<span class="text-[7px] md:text-xl font-black '+bar.textColor+' uppercase tracking-[0.1em] md:tracking-[0.4em]">'+bar.label+'</span>'+
      '</div>'+
    '</div>';
  }).join('');
  return '<div class="bg-[#08080a] py-6 md:py-10 px-4 md:px-16 rounded-[2rem] md:rounded-[4rem] border border-white/5 shadow-[0_60px_120px_-20px_rgba(0,0,0,1)] overflow-hidden relative group">'+
    '<div class="absolute top-0 left-1/4 w-1/2 h-full bg-blue-500/5 blur-[150px] pointer-events-none"></div>'+
    '<div class="absolute inset-0 opacity-[0.15] pointer-events-none" style="background-image:linear-gradient(to right,#52525b 1px,transparent 1px),linear-gradient(to bottom,#52525b 1px,transparent 1px);background-size:32px 32px"></div>'+
    '<div class="flex flex-col items-center mb-10 md:mb-14 relative z-10 w-full"><div class="flex items-center justify-center gap-4 md:gap-16 w-full px-2">'+
      flagHtml()+
      '<div class="text-center px-2"><h3 class="text-[26px] sm:text-3xl md:text-5xl font-black text-white tracking-tighter uppercase italic drop-shadow-[0_0_20px_rgba(255,255,255,0.2)] whitespace-nowrap leading-none">燈號分佈統計</h3></div>'+
      flagHtml()+
    '</div></div>'+
    '<div class="flex h-52 md:h-[320px] relative z-10">'+
      '<div class="flex flex-col justify-between h-full pr-4 md:pr-10 border-r-2 border-zinc-800/80">'+axis+'</div>'+
      '<div class="flex-grow flex items-end justify-around px-2 md:px-20 relative">'+
        '<div class="absolute inset-0 px-2 md:px-20 flex flex-col justify-between pointer-events-none opacity-20">'+grid+'</div>'+bars+
      '</div>'+
    '</div>'+
  '</div>';
}
function lightUpStats(){
  var total=STATS.green+STATS.yellow+STATS.red+STATS.black;
  BARS.forEach(function(bar){
    var lit=Math.round(STATS[bar.key]/total*100/100*SEGMENTS);
    document.querySelectorAll('[data-bar="'+bar.key+'"]').forEach(function(el){el.className=segClass(bar,Number(el.getAttribute('data-b')),lit,true);});
  });
  document.querySelectorAll('[data-glow]').forEach(function(el){el.classList.remove('opacity-0');el.classList.add('opacity-40');});
}

/* ── 會員卡片（滑鼠 3D 傾斜、升降閃光、滿分流光） ── */
function createCard(m){
  var s=m.scores,v=s.trafficLightScore,prev=s.previousTrafficLightScore,perfect=v===100,col=cardColor(v);
  var delta=prev===undefined||prev===null?0:v-prev;
  var bd=badgesOf(m);
  var wrap=document.createElement('div');
  wrap.className='perspective-1000';
  wrap.innerHTML='<button type="button" class="group w-full text-left py-2 px-4 rounded-xl shadow transition-all duration-300 flex items-center justify-between focus:outline-none relative overflow-hidden active:scale-[0.98] '+
      (perfect?'bg-[#0d1117] border-none shadow-[0_0_45px_rgba(255,255,255,0.18)]':'bg-[#0f1115] border border-white/5 hover:border-white/10')+'" style="transform:rotateX(0deg) rotateY(0deg);transition:all 0.5s ease">'+
    (perfect?'<div class="absolute inset-0 z-0 pointer-events-none overflow-hidden">'+
      '<div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/[0.25] to-transparent -translate-x-full animate-shimmer-sweep-intense"></div>'+
      '<div class="absolute top-0 left-0 right-0 h-[1.5px] bg-gradient-to-r from-transparent via-white/40 to-transparent animate-shimmer-sweep-intense"></div>'+

function radarHtml(m,color){

      '<defs><filter id="glow"><feGaussianBlur stdDeviation="2" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>'+

  });

      if(st.dead||id!==st.loop)return;
      var k=Math.min((Date.now()-t0)/1200,1);
      setShown(k<1?Math.floor(j*(1-Math.pow(1-k,4))):j);
      if(k<1)requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
  function onKey(e){if(e.key==='Escape')close();}
  function unmount(){
    st.dead=true;clearTimeout(st.radarTimer);window.removeEventListener('keydown',onKey);
    document.body.style.overflow='unset';el.remove();
  }
  function close(){
    /* 同原版：每次觸發都在 0.3 秒後播放關閉音效，並關掉當下開著的明細（計時先開始，再重繪） */
    setTimeout(function(){playSound('close');if(detail){var d=detail;detail=null;d.unmount();}},300);
    if(!st.closing){st.closing=true;render();}   /* 第一次觸發：淡出縮小（重繪一次） */
  }
  render();
  document.getElementById('app').appendChild(el);
  document.body.style.overflow='hidden';
  window.addEventListener('keydown',onKey);
  el.addEventListener('click',close);
  sheet.addEventListener('click',function(e){e.stopPropagation();});
  xBtn.addEventListener('click',close);
  startCount();
  return {
    unmount:unmount,
    rerender:function(){if(!st.dead)render();},
    select:function(m){   /* 換人：原地重繪；分數不同才重新跳動（數字先停在原本的值） */
      if(m===st.m||st.dead)return;
      var restart=m.scores.trafficLightScore!==st.m.scores.trafficLightScore;
      st.m=m;render();
      if(restart)startCount();
    }
  };
}

/* ── 頁尾與組裝 ── */
function footerHtml(){
  return '<footer class="text-center text-[10px] text-gray-600 mt-12 py-8 border-t border-white/5"><p class="tracking-widest uppercase">© 2026 欣冠達國際實業有限公司 林沛綺｜All Rights Reserved'+
    (D.updated?'<span class="block mt-1 opacity-50 font-mono italic">Report Generated: <!---->'+esc(String(D.updated).split('-').join('/'))+'</span>':'')+'</p></footer>';
}
document.getElementById('root').innerHTML='<div id="app" class="min-h-screen bg-black text-gray-200 font-sans selection:bg-white selection:text-black">'+
  '<div class="container mx-auto p-4 md:p-6 lg:p-8 max-w-7xl">'+headerHtml()+
    '<div class="space-y-4">'+statsHtml()+toolbarHtml()+'<main class="mt-2" id="main"></main></div>'+footerHtml()+
  '</div></div>';
var qEl=document.querySelector('#app input'),lastQ='',typed=false;
/* 搜尋框輸入時上層重繪：卡片篩選，開著的明細也跟著重繪（同原版：字沒有變就不重繪，例如選字確認、重打同一個字） */
qEl.addEventListener('input',function(){typed=true;if(qEl.value===lastQ)return;lastQ=qEl.value;renderGrid();if(detail)detail.rerender();});
/* 上一頁返回時瀏覽器可能自動填回舊的搜尋字（原版的輸入框由 React 之後才建立，不會被填回）；使用者自己打的字保留 */
window.addEventListener('pageshow',function(e){if(!e.persisted&&!typed&&qEl.value)qEl.value='';});
renderGrid();
afterPaint(function(){setTimeout(lightUpStats,200);});
firstRender=false;
</script>
<script>
(function () {
  var API = "https://script.google.com/macros/s/AKfycbyrqyy6zxRb4sGmMPOdQTRRgbfdDu5RmaoaOXK0k5xic9XaRdM_lyBDcT5fOUl0v6aCYg/exec";
  var q = location.search.match(/[?&]k=([^&#]+)/), h = location.hash.replace(/^#/, '');
  var key = q ? decodeURIComponent(q[1]) : h;
  function fail(msg) {
    var el = document.getElementById('loading');
    el.style.color = '#f87171'; el.style.letterSpacing = '0'; el.style.padding = '32px'; el.style.textAlign = 'center';
    el.textContent = msg;
  }
  function run(d) {
    if (!d || d.error) return fail(d && d.error ? d.error : '讀取失敗，請稍後再試。');
    window.__DASHBOARD_DATA__ = d;
    document.getElementById('loading').remove();
    var s = document.createElement('script');
    s.textContent = document.getElementById('app-src').textContent;
    document.body.appendChild(s);
  }
  if (!key) return fail('連結不完整，請在 LINE 領導團隊群組輸入「儀表板」取得連結。');
  // 不帶 Google 登入 cookie：避免手機同時登入多個 Google 帳號時被導到「無法開啟這個檔案」
  fetch(API + '?data=' + encodeURIComponent(key), { credentials: 'omit', cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(run, function () { fail('讀取失敗，請確認網路後重新整理。'); });
})();
</script>
