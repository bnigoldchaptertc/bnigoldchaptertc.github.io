<h2>用途</h2>
<p>本工具由全鑫分會領導團隊使用，於 Google Apps Script 上執行，協助分會：</p>
<ul>
<li>每週整理分會在 BNI Connect 的管理報表，並依 BNI 官方標準計算紅綠燈分數</li>
<li>透過分會 LINE 官方帳號，讓會員查詢自己的紅綠燈分數、讓領導團隊查看週報</li>
<li>更新分會內部使用的試算表與儀表板</li>
</ul>
<p>本工具僅供分會內部使用，不對外提供服務。</p>
